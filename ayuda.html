<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Segunda pista</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="card">
      <div id="waiting">
        <p class="kicker">Pediste ayuda</p>
        <h1>RENDIRSE<br>TIENE UN PRECIO</h1>
        <p class="subtitle">La próxima pista estará disponible en:</p>

        <div id="timer" class="timer" aria-live="polite">10:00</div>

        <p class="small">Cerrar o recargar esta página no reinicia la espera.</p>
      </div>

      <div id="reveal" class="hidden">
        <p class="kicker">Segunda pista</p>
        <h1>¿CÓMO ESTAMOS NOSOTROS?</h1>

        <div class="rule"></div>

        <p class="subtitle">La respuesta también tiene seis letras.</p>
      </div>
    </section>

    <div class="footer">A veces la respuesta estuvo a la vista desde el principio.</div>
  </main>

  <script>
  (() => {
    const TIMER_MINUTES = 10;
    const STORAGE_KEY = "lucre_cryptex_help_unlock_v1";

    const waiting = document.getElementById("waiting");
    const reveal = document.getElementById("reveal");
    const timer = document.getElementById("timer");
    const params = new URLSearchParams(location.search);

    if (params.get("reset") === "1") {
      localStorage.removeItem(STORAGE_KEY);
      history.replaceState({}, "", "ayuda.html");
    }

    const durationMs = params.get("test") === "1"
      ? 10 * 1000
      : TIMER_MINUTES * 60 * 1000;

    let unlockAt = Number(localStorage.getItem(STORAGE_KEY));

    if (!unlockAt || Number.isNaN(unlockAt)) {
      unlockAt = Date.now() + durationMs;
      localStorage.setItem(STORAGE_KEY, String(unlockAt));
    }

    const showReveal = () => {
      waiting.classList.add("hidden");
      reveal.classList.remove("hidden");
      reveal.classList.add("reveal");
    };

    const tick = () => {
      const remaining = unlockAt - Date.now();

      if (remaining <= 0) {
        showReveal();
        return;
      }

      const totalSeconds = Math.ceil(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      timer.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

      setTimeout(tick, 250);
    };

    tick();
  })();
  </script>
</body>
</html>
