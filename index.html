<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Lucre</title>
  <style>
    :root{
      --bg:#0b0b0c;
      --fg:#f3f3f4;
      --muted:#8e8e93;
      --line:#222226;
      --accent:#d8d8dc;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background:var(--bg);
      color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    main{
      width:min(92vw,720px);
      text-align:center;
      padding:32px 20px;
    }
    .eyebrow{
      text-transform:uppercase;
      letter-spacing:.28em;
      font-size:12px;
      color:var(--muted);
      margin-bottom:30px;
    }
    #timer{
      font-variant-numeric:tabular-nums;
      font-size:clamp(48px,13vw,112px);
      font-weight:300;
      letter-spacing:.02em;
      line-height:1;
      margin:0 0 28px;
    }
    .hint{
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
      min-height:24px;
    }
    .hidden{display:none!important}
    #reveal{
      animation:fadeIn 1.2s ease both;
    }
    #reveal h1{
      font-size:clamp(34px,8vw,72px);
      font-weight:500;
      letter-spacing:.02em;
      margin:0 0 18px;
    }
    #reveal p{
      color:var(--muted);
      font-size:16px;
      line-height:1.6;
      margin:0 auto 28px;
      max-width:520px;
    }
    #pigpenImage{
      display:block;
      max-width:min(92vw,680px);
      max-height:38vh;
      margin:24px auto 0;
      filter:invert(1);
    }
    .fallback-code{
      margin:28px auto 0;
      border:1px solid var(--line);
      border-radius:16px;
      padding:24px 18px;
      max-width:560px;
      color:var(--accent);
      font-size:18px;
      letter-spacing:.16em;
    }
    @keyframes fadeIn{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }
  </style>
</head>
<body>
  <main>
    <section id="countdown">
      <div class="eyebrow">Para Lucre</div>
      <div id="timer">00:10:00</div>
      <div class="hint">Todavía no.</div>
    </section>

    <section id="reveal" class="hidden">
      <div class="eyebrow">Ahora sí</div>
      <h1>Descifralo.</h1>
      <p>La respuesta tiene seis letras.</p>

      <!--
        OPCIÓN RECOMENDADA:
        Guardá la imagen final del Pigpen en la misma carpeta con el nombre:
        pigpen.png
        Si existe, la página la muestra automáticamente.
      -->
      <img id="pigpenImage" src="pigpen.png" alt="Mensaje cifrado" onerror="this.classList.add('hidden');document.getElementById('fallback').classList.remove('hidden');">

      <!-- Se ve solamente si todavía no agregaste pigpen.png -->
      <div id="fallback" class="fallback-code hidden">
        REEMPLAZAR POR LOS 6 SÍMBOLOS PIGPEN
      </div>
    </section>
  </main>

  <script>
    /*
      ============================
      CONFIGURACIÓN
      ============================

      MODE:
      "relative" = cuenta X minutos desde LA PRIMERA VEZ que Lucre abre el link.
                   Si recarga o cierra Safari, el reloj sigue desde donde iba.
      "fixed"    = cuenta hasta una fecha/hora exacta.

      Para usar hora exacta de Argentina:
      TARGET_ISO = "2026-09-22T10:30:00-03:00"
    */
    const MODE = "relative";

    // Solo se usa con MODE = "relative"
    const RELATIVE_MINUTES = 10;

    // Solo se usa con MODE = "fixed"
    const TARGET_ISO = "2026-09-22T10:30:00-03:00";

    // Texto breve que aparece debajo del contador.
    const COUNTDOWN_HINT = "Todavía no.";

    // Clave de almacenamiento. Cambiala si querés reiniciar todas las pruebas.
    const STORAGE_KEY = "lucre_countdown_unlock_v1";

    const countdownEl = document.getElementById("countdown");
    const revealEl = document.getElementById("reveal");
    const timerEl = document.getElementById("timer");
    document.querySelector(".hint").textContent = COUNTDOWN_HINT;

    function getUnlockTime(){
      if(MODE === "fixed"){
        return new Date(TARGET_ISO).getTime();
      }

      let saved = localStorage.getItem(STORAGE_KEY);
      if(saved) return Number(saved);

      const unlock = Date.now() + RELATIVE_MINUTES * 60 * 1000;
      localStorage.setItem(STORAGE_KEY, String(unlock));
      return unlock;
    }

    const unlockTime = getUnlockTime();

    function pad(n){ return String(n).padStart(2,"0"); }

    function reveal(){
      countdownEl.classList.add("hidden");
      revealEl.classList.remove("hidden");
      document.title = "Ahora sí";
    }

    function tick(){
      const diff = unlockTime - Date.now();

      if(diff <= 0){
        timerEl.textContent = "00:00:00";
        reveal();
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      timerEl.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      requestAnimationFrame(() => setTimeout(tick, 250));
    }

    tick();
  </script>
</body>
</html>
